# ARGUS Logging Configuration
logging:
  version: 1
  formatters:
    standard:
      format: "%(asctime)s | %(levelname)-8s | %(name)-30s | %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
  handlers:
    console:
      class: logging.StreamHandler
      formatter: standard
      stream: ext://sys.stdout
  loggers:
    argus:
      level: INFO
      handlers: [console]
      propagate: false
  root:
    level: WARNING
    handlers: [console]
